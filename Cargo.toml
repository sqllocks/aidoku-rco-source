[package]
name = "readcomiconline"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs" }

[dev-dependencies]
aidoku-test = { git = "https://github.com/Aidoku/aidoku-rs" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
