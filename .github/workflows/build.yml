name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install aidoku-cli
        run: cargo install --git https://github.com/Aidoku/aidoku-rs aidoku-cli

      - name: Build source
        run: aidoku package

      - name: Rename artifact
        run: mv package.aix ReadComicOnline.aix

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: ReadComicOnline.aix
          make_latest: true

      - name: Generate source list
        run: |
          mkdir -p public
          cat > public/index.min.json << 'EOF'
          {"sources":[{"id":"en.readcomiconline","name":"ReadComicOnline","lang":"en","version":1,"url":"https://github.com/SQLLocks/aidoku-rco-source/releases/latest/download/ReadComicOnline.aix"}]}
          EOF

      - name: Deploy source list to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
